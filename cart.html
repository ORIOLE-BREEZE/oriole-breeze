```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Cart | Oriole Breeze</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Manrope',sans-serif;
background:#F9F6F1;
color:#4A3527;
}


/* NAVIGATION */

nav{
width:100%;
padding:22px 9%;
display:flex;
justify-content:center;
background:rgba(249,246,241,.92);
backdrop-filter:blur(12px);
}

nav ul{
display:flex;
gap:35px;
list-style:none;
}

nav a{
text-decoration:none;
color:#4A3527;
font-weight:600;
}


/* CART */

.cart-page{
min-height:100vh;
padding:140px 9% 100px;
max-width:1000px;
margin:auto;
}

.cart-page h1{
font-family:'Cormorant Garamond',serif;
font-size:65px;
font-weight:600;
margin-bottom:50px;
text-align:center;
}


/* CART ITEMS */

.cart-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:30px;
padding:25px 0;
border-bottom:1px solid #DED4C8;
}

.cart-item-info h2{
font-family:'Cormorant Garamond',serif;
font-size:30px;
margin-bottom:6px;
}

.cart-item-info p{
color:#7b6250;
font-size:15px;
}

.cart-controls{
display:flex;
align-items:center;
gap:15px;
}

.cart-controls button{
width:34px;
height:34px;
border:none;
border-radius:50%;
background:#E8D8C3;
color:#4A3527;
font-size:18px;
cursor:pointer;
}

.cart-quantity{
min-width:20px;
text-align:center;
}

.cart-price{
font-size:18px;
font-weight:600;
min-width:90px;
text-align:right;
}


/* REMOVE */

.remove{
border:none;
background:none;
color:#9A7048;
cursor:pointer;
font-family:'Manrope',sans-serif;
font-size:13px;
}

.remove:hover{
color:#4A3527;
}


/* TOTAL */

.cart-summary{
margin-top:45px;
padding:30px;
background:#F3E8D5;
border-radius:20px;
text-align:right;
}

.cart-summary p{
font-size:18px;
margin-bottom:20px;
}

.cart-summary strong{
font-size:26px;
}


/* WHATSAPP BUTTON */

.checkout-button{
display:inline-block;
margin-top:20px;
padding:16px 42px;
background:#C8A96A;
color:white;
border:none;
border-radius:50px;
font-family:'Manrope',sans-serif;
font-size:16px;
font-weight:600;
cursor:pointer;
text-decoration:none;
transition:.3s;
}

.checkout-button:hover{
background:#4A3527;
transform:translateY(-3px);
}


/* EMPTY CART */

.empty-cart{
text-align:center;
padding:60px 20px;
color:#7b6250;
}

.empty-cart p{
font-size:18px;
margin-bottom:25px;
}


/* MOBILE */

@media(max-width:700px){

.cart-page{
padding:120px 7% 70px;
}

.cart-page h1{
font-size:50px;
}

.cart-item{
flex-wrap:wrap;
}

.cart-price{
text-align:left;
}

.cart-summary{
text-align:center;
}

}

</style>

</head>


<body>


<!-- NAVIGATION -->

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="index.html#collection">Collection</a></li>

<li><a href="index.html#upcoming">Upcoming</a></li>

<li><a href="index.html#story">Our Story</a></li>

<li><a href="index.html#contact">Contact</a></li>

</ul>

</nav>


<!-- CART -->

<section class="cart-page">

<h1>Your Cart</h1>

<div id="cartItems"></div>

<div class="cart-summary" id="cartSummary">

<p>
Total: <strong id="cartTotal">₹0</strong>
</p>

<button class="checkout-button" onclick="orderOnWhatsApp()">
Order on WhatsApp
</button>

</div>

</section>


<script>

function displayCart(){

let cart = JSON.parse(localStorage.getItem("orioleCart")) || [];

let cartItems = document.getElementById("cartItems");

let cartSummary = document.getElementById("cartSummary");

let cartTotal = document.getElementById("cartTotal");


if(cart.length === 0){

cartItems.innerHTML = `
<div class="empty-cart">

<p>Your cart is empty.</p>

<a href="index.html#collection" class="checkout-button">
Explore Collection
</a>

</div>
`;

cartSummary.style.display = "none";

return;

}


let total = 0;

cartItems.innerHTML = "";


cart.forEach((item,index) => {

let itemTotal = item.price * item.quantity;

total += itemTotal;


cartItems.innerHTML += `

<div class="cart-item">

<div class="cart-item-info">

<h2>${item.name}</h2>

<p>30 mL · ₹${item.price}</p>

</div>


<div class="cart-controls">

<button onclick="changeQuantity(${index},-1)">
−
</button>

<span class="cart-quantity">
${item.quantity}
</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

</div>


<div class="cart-price">

₹${itemTotal}

</div>


<button class="remove" onclick="removeItem(${index})">
Remove
</button>

</div>

`;

});


cartTotal.textContent = "₹" + total;

}


function changeQuantity(index,amount){

let cart = JSON.parse(localStorage.getItem("orioleCart")) || [];

cart[index].quantity += amount;


if(cart[index].quantity <= 0){

cart.splice(index,1);

}


localStorage.setItem("orioleCart",JSON.stringify(cart));

displayCart();

}


function removeItem(index){

let cart = JSON.parse(localStorage.getItem("orioleCart")) || [];

cart.splice(index,1);

localStorage.setItem("orioleCart",JSON.stringify(cart));

displayCart();

}


/* WHATSAPP ORDER */

function orderOnWhatsApp(){

let cart = JSON.parse(localStorage.getItem("orioleCart")) || [];

if(cart.length === 0){
return;
}

let total = 0;

let message = "Hi Oriole Breeze! 🐦✨\n\n";

message += "I'd like to place an order:\n\n";


cart.forEach(item => {

let itemTotal = item.price * item.quantity;

total += itemTotal;

message += `${item.name} × ${item.quantity} — ₹${itemTotal}\n`;

});


message += `\nTotal: ₹${total}\n\n`;

message += "Name:\n";
message += "Address:\n";
message += "Phone:\n";


let whatsappNumber = "919619551015";

let whatsappURL =
"https://wa.me/" + whatsappNumber +
"?text=" + encodeURIComponent(message);


window.open(whatsappURL, "_blank");

}


displayCart();

</script>


</body>

</html>
```
